<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    .tooltip-btn {
      position: relative;
      cursor: pointer;
      padding: 10px 20px;
      margin: 100px;
    }

    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      white-space: nowrap;

      /* Position it above the button */
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);

      transition: opacity 0.2s ease;
    }

    /* Show it on hover */
    .tooltip-btn:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head> 

<body>
  <button class="tooltip-btn">
    Hover me
    <span class="tooltip-text">This is the popup text!</span>
  </button>
</body>

</html>
